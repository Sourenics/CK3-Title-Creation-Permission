l_japanese:
 rule_tcp_title_creation_permission:0 "#color_light_red TCP:#! Title Creation Permission"
 setting_tcp_title_creation_permission_vanilla:0 "Vanilla"
 setting_tcp_title_creation_permission_vanilla_desc:0 "All [vassals|E] create [titles|E] as in vanilla."
 setting_tcp_title_creation_permission_player_realms:0 "Player Realms"
 setting_tcp_title_creation_permission_player_realms_desc:0 "Only in realms whose [top_liege|E] is a player: all [vassals|E] there, direct or indirect, need the player's permission to create [titles|E] when the player is [feudal|E] with the [crown_authority|E] set by the #V TCP: Required Crown Authority#! rule (by default, [GetLaw('crown_authority_3').GetName]), or is an [administrative_government|E] [emperor|E]. Realms with an AI [top_liege|E] work as in vanilla.\n\nThey can ask for permission with the #V Request Title Creation#! interaction, and the [top_liege|E] can grant it with #V Grant Title Creation#!."

 rule_tcp_required_crown_authority:0 "#color_light_red TCP:#! Required Crown Authority"
 setting_tcp_required_crown_authority_3:0 "Absolute"
 setting_tcp_required_crown_authority_3_desc:0 "A [feudal|E] [top_liege|E] requires permission only with [GetLaw('crown_authority_3').GetName]."
 setting_tcp_required_crown_authority_2:0 "High or higher"
 setting_tcp_required_crown_authority_2_desc:0 "A [feudal|E] [top_liege|E] requires permission with [GetLaw('crown_authority_2').GetName] or higher."
 setting_tcp_required_crown_authority_1:0 "Limited or higher"
 setting_tcp_required_crown_authority_1_desc:0 "A [feudal|E] [top_liege|E] requires permission with [GetLaw('crown_authority_1').GetName] or higher."
 setting_tcp_required_crown_authority_0:0 "Any"
 setting_tcp_required_crown_authority_0_desc:0 "A [feudal|E] [top_liege|E] always requires permission, whatever their [crown_authority|E], even with [GetLaw('crown_authority_0').GetName]."

 tcp_needs_permission_to_create_tt:0 "Your [top_liege|E] has given you permission to create this [title|E]"

 tcp_request_title_creation_interaction:0 "Request Title Creation"
 tcp_request_title_creation_interaction_desc:0 "Ask [recipient.GetShortUINameNoTooltip] for permission to create a [title|E]. In [recipient.GetHerHis] [realm|E], [vassals|E] cannot create [titles|E] without it.\n\nThe permission lasts #V 5#! years, and you still have to meet the usual requirements to create the [title|E]. If [recipient.GetSheHe] refuses, you will resent it."

 tcp_request_title_creation_notification:0 "My liege,\n\nThe lands I hold in your name have prospered, and their people now look to a single banner. With your blessing, I would raise them as the [target.GetName], to be held as all things in your realm are held: from you, and for you.\n\nI will not take up a title you have not given. I await your word."
 tcp_request_title_creation_notification_2:0 "My liege,\n\nI have long governed my lands in your name, and they have grown beyond the counties that make them up. With your permission, I would raise them as the [target.GetName].\n\nI remain, as ever, your faithful vassal."
 tcp_request_title_creation_notification_resentful:0 "[recipient.GetFirstNameNoTooltip],\n\nThe law of your realm forbids me from raising the [target.GetName] without your leave, so I ask for it, as the law demands. Its lands are already mine. All that is missing is your seal.\n\nI trust you will not refuse me out of spite. I would not forget it."
 tcp_request_title_creation_notification_resentful_2:0 "[recipient.GetFirstNameNoTooltip],\n\nI will not pretend there is any warmth between us, and I will not waste ink on flattery. I hold the lands of the [target.GetName]. I ask only for what your law withholds.\n\nDeny me, and the whole realm will know why."
 tcp_request_title_creation_notification_ancestral:0 "My liege,\n\nThe [target.GetName] was once held by my forefathers, and its people still remember the name of my house. I ask your leave to raise it again, so that what my blood once built may stand anew under your rule.\n\nGrant me this, and my house will owe you a debt it will not forget."
 tcp_request_title_creation_notification_ancestral_2:0 "My liege,\n\nIn the halls of my family, we still speak of the days when we ruled the [target.GetName]. Those days need not be only memories: the lands are mine once more, and all that is lacking is your consent.\n\nLet my ancestors rest easy. Let me restore what they lost."
 tcp_request_title_creation_notification_heir:0 "My liege,\n\nOne day, God willing many years from now, all that you rule will pass to me. Let me show you now that I can bear its weight: allow me to raise the [target.GetName] and govern it as you would.\n\nWhat I build today, I will one day return to the crown with interest."
 tcp_request_title_creation_notification_heir_2:0 "My liege,\n\nAs your heir, I would not have it said that I sat idle while waiting for my inheritance. I ask your leave to raise the [target.GetName], and to learn to rule a great title while you are still here to guide me.\n\nIt would be yours twice over: now by your leave, and later by my blood."
 tcp_request_title_creation_notification_family:0 "[recipient.GetFirstNameNoTooltip],\n\nI write to you not only as your vassal, but as your own blood. The lands I hold have grown into something worthy of a greater name, and I would see them raised as the [target.GetName].\n\nWhatever honor it brings me will reflect upon our family, and upon you above all. Grant me this, and you will have no more steadfast ally in all your realm."
 tcp_request_title_creation_notification_family_2:0 "[recipient.GetFirstNameNoTooltip],\n\nForgive me for writing as kin rather than as vassal, but I know you will hear me better this way. I would raise the [target.GetName], and I would rather owe it to you than to anyone else.\n\nLet it be said that our family rises together."
 tcp_request_title_creation_notification_loyal:0 "My liege,\n\nI have served you faithfully, and I hope my loyalty speaks louder than any letter could. I come now to ask a favor: allow me to raise my lands as the [target.GetName].\n\nIt would be yours as surely as I am, and I would hold it with the same devotion I have always shown you."
 tcp_request_title_creation_notification_loyal_2:0 "My liege,\n\nWhen others hesitated, I stood by you, and I will stand by you still, whatever your answer. But if my service has earned anything, let it be this: your leave to raise the [target.GetName].\n\nIts banner would be one more raised in your honor."
 tcp_request_title_creation_notification_ambitious:0 "My liege,\n\nI will be plain: I mean to rise, and I would rather rise with your blessing than without it. The lands of the [target.GetName] are under my rule, and they deserve a lord bold enough to claim the name.\n\nGive me your leave, and I will make it a title worthy of your realm."
 tcp_request_title_creation_notification_ambitious_2:0 "My liege,\n\nA realm grows great when its vassals do. I have gathered the lands of the [target.GetName], and I will not let them languish as scattered counties when they could be a single, mighty title.\n\nLet me raise it. You will not find me lacking in the ambition to make it shine."
 tcp_request_title_creation_notification_arrogant:0 "My liege,\n\nIt hardly needs saying that no one in your realm is better suited to hold the [target.GetName] than I am. The lands are already mine; the title is a formality.\n\nStill, the law asks that I seek your seal, and so I do."
 tcp_request_title_creation_notification_arrogant_2:0 "My liege,\n\nI write as the law requires, though I confess I find it strange that a lord of my standing must ask at all. The [target.GetName] should be mine, as anyone with eyes can see.\n\nI trust you will see it too."
 tcp_request_title_creation_notification_humble:0 "My liege,\n\nI hesitate even to ask, for I have always been content with what you have given me. Yet my people wish to see our lands raised as the [target.GetName], and I would not refuse them without first asking you.\n\nIf you think it unwise, I will not ask again."
 tcp_request_title_creation_notification_humble_2:0 "My liege,\n\nI am a simple steward of the lands you entrust to me, and I do not seek greatness for its own sake. But the [target.GetName] could be raised from these lands, and it would serve your realm well.\n\nI leave the matter entirely in your hands."
 tcp_request_title_creation_notification_renowned:0 "My liege,\n\nMy name is known across your realm, and with it the deeds I have done in your service. Men already speak of my lands as if they were the [target.GetName]. I ask only that you make it so.\n\nA title worthy of my renown would only add to yours."
 tcp_request_title_creation_notification_renowned_2:0 "My liege,\n\nThey sing of my deeds in the halls of your realm, and it would be strange for so renowned a vassal to hold no worthy title. Let me raise the [target.GetName], and let its glory be counted among your own.\n\nI await your word."
 tcp_request_title_creation_notification_crown:0 "My liege,\n\nWhat I ask of you is no small thing. The [target.GetName] has long gone without anyone to wear its crown, and the lands that would form it already answer to me. I would raise it anew, though I know full well that no crown in your realm may be lifted but by your hand.\n\nSay the word, and it shall be raised in your name, its banner flying beneath your own."
 tcp_request_title_creation_notification_crown_2:0 "My liege,\n\nI do not ask lightly for a crown. The [target.GetName] is a great and ancient name, and I know what it means to raise it within your realm. Know that I would wear it as your vassal, never as your rival.\n\nIt would be one more jewel in your own crown."

 tcp_grant_title_creation_interaction:0 "Grant Title Creation"
 tcp_grant_title_creation_interaction_desc:0 "Allow [recipient.GetShortUINameNoTooltip] to create a [title|E] in your [realm|E]. Without your permission, your [vassals|E] cannot create [titles|E].\n\nThe permission lasts #V 5#! years, and [recipient.GetSheHe] still has to meet the usual requirements to create the [title|E]."

 tcp_request_title_creation_accepted_toast:0 "Title Creation Allowed"
 tcp_request_title_creation_declined_toast:0 "Title Creation Refused"
 tcp_grant_title_creation_toast:0 "Title Creation Allowed"
 tcp_permission_granted_tt:0 "You may create [tcp_title.GetName] within the next #V 5#! years"
 tcp_permission_declined_tt:0 "You may not create [tcp_title.GetName]"

 tcp_refused_title_creation_opinion:0 "Refused My Title Creation"

 tcp_answer_accepted_title:0 "Your Vassal’s Gratitude"
 tcp_answer_refused_title:0 "Your Vassal’s Reaction"
 tcp_answer_accepted:0 "[tcp_vassal.GetShortUIName|U] bows. “I thank you, my liege. It will be held in your name.”"
 tcp_answer_accepted_resentful:0 "[tcp_vassal.GetShortUIName|U] acknowledges your permission with a curt nod. “So you can be reasonable after all.”"
 tcp_answer_accepted_ambitious:0 "[tcp_vassal.GetShortUIName|U]’s eyes gleam. “Thank you, my liege. This is only the beginning.”"
 tcp_answer_accepted_arrogant:0 "[tcp_vassal.GetShortUIName|U] barely looks surprised. “As it should be. I expected nothing less.”"
 tcp_answer_accepted_humble:0 "[tcp_vassal.GetShortUIName|U] bows deeply. “You honor me far beyond what I deserve, my liege.”"
 tcp_answer_accepted_family:0 "[tcp_vassal.GetShortUIName|U] smiles warmly. “Our family will not forget this.”"
 tcp_answer_accepted_loyal:0 "[tcp_vassal.GetShortUIName|U] kneels before you. “You have my undying gratitude, my liege. I will not fail you.”"
 tcp_answer_refused:0 "[tcp_vassal.GetShortUIName|U] accepts your refusal with a stiff bow, but cannot quite hide [tcp_vassal.GetHerHis] disappointment."
 tcp_answer_refused_resentful:0 "[tcp_vassal.GetShortUIName|U]’s face hardens. “I see. I will remember this.”"
 tcp_answer_refused_ambitious:0 "[tcp_vassal.GetShortUIName|U] clenches [tcp_vassal.GetHerHis] jaw. “Then I will find another way to rise.”"
 tcp_answer_refused_arrogant:0 "[tcp_vassal.GetShortUIName|U] laughs bitterly. “You fear what I would become. Very well.”"
 tcp_answer_refused_humble:0 "[tcp_vassal.GetShortUIName|U] bows. “As you wish, my liege. I should not have asked.”"
 tcp_answer_refused_family:0 "[tcp_vassal.GetShortUIName|U] looks away. “I had hoped blood would count for more than this.”"
 tcp_answer_refused_loyal:0 "[tcp_vassal.GetShortUIName|U] sighs, but bows. “I do not understand, my liege, but I will obey.”"
