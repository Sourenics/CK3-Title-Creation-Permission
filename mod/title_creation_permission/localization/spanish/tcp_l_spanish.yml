l_spanish:
 rule_tcp_title_creation_permission:0 "#color_light_red TCP:#! Permiso para crear títulos"
 setting_tcp_title_creation_permission_vanilla:0 "Juego base"
 setting_tcp_title_creation_permission_vanilla_desc:0 "Los [vassals|E] crean [titles|E] como en el juego base."
 setting_tcp_title_creation_permission_player_realms:0 "Reinos de jugadores"
 setting_tcp_title_creation_permission_player_realms_desc:0 "Solo en los reinos cuyo [top_liege|E] es un jugador: todos sus [vassals|E], directos o indirectos, necesitan el permiso del jugador para crear [titles|E] cuando este es [feudal|E] con la [crown_authority|E] que fija la regla #V TCP: Autoridad de la corona necesaria#! (por defecto, [GetLaw('crown_authority_3').GetName]), o es un [emperor|E] con [administrative_government|E]. Los reinos con un [top_liege|E] de la IA funcionan como en el juego base.\n\nPueden pedir permiso con la interacción #V Pedir creación de título#!, y el [top_liege|E] puede concederlo con #V Conceder creación de título#!."

 rule_tcp_required_crown_authority:0 "#color_light_red TCP:#! Autoridad de la corona necesaria"
 setting_tcp_required_crown_authority_3:0 "Absoluta"
 setting_tcp_required_crown_authority_3_desc:0 "Un [top_liege|E] [feudal|E] exige permiso solo con [GetLaw('crown_authority_3').GetName]."
 setting_tcp_required_crown_authority_2:0 "Alta o superior"
 setting_tcp_required_crown_authority_2_desc:0 "Un [top_liege|E] [feudal|E] exige permiso con [GetLaw('crown_authority_2').GetName] o superior."
 setting_tcp_required_crown_authority_1:0 "Limitada o superior"
 setting_tcp_required_crown_authority_1_desc:0 "Un [top_liege|E] [feudal|E] exige permiso con [GetLaw('crown_authority_1').GetName] o superior."
 setting_tcp_required_crown_authority_0:0 "Cualquiera"
 setting_tcp_required_crown_authority_0_desc:0 "Un [top_liege|E] [feudal|E] siempre exige permiso, tenga la [crown_authority|E] que tenga, incluso con [GetLaw('crown_authority_0').GetName]."

 tcp_needs_permission_to_create_tt:0 "Tu [top_liege|E] te ha dado permiso para crear este [title|E]"

 tcp_request_title_creation_interaction:0 "Pedir creación de título"
 tcp_request_title_creation_interaction_desc:0 "Pide permiso a [recipient.GetShortUINameNoTooltip] para crear un [title|E]. En su [realm|E], los [vassals|E] no pueden crear [titles|E] sin él.\n\nEl permiso dura #V 5#! años, y sigues teniendo que cumplir los requisitos habituales para crear el [title|E]. Si se niega, te lo tomarás a mal."

 tcp_request_title_creation_notification:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nLas tierras que gobierno en vuestro nombre han prosperado, y sus gentes ya miran a un mismo estandarte. Con vuestra bendición, las alzaría como el [target.GetName], que se tendría como se tiene todo en vuestro reino: de vos y para vos.\n\nNo tomaré un título que no me hayáis concedido. Aguardo vuestra palabra."
 tcp_request_title_creation_notification_2:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nHace mucho que gobierno mis tierras en vuestro nombre, y han crecido más allá de los condados que las forman. Con vuestro permiso, las alzaría como el [target.GetName].\n\nSigo siendo, como siempre, vuestr[actor.Custom('ES_OA')] fiel vasall[actor.Custom('ES_OA')]."
 tcp_request_title_creation_notification_resentful:0 "[recipient.GetFirstNameNoTooltip]:\n\nLa ley de vuestro reino me prohíbe alzar el [target.GetName] sin vuestro permiso, así que os lo pido, como la ley exige. Sus tierras ya son mías. Solo falta vuestro sello.\n\nConfío en que no me lo neguéis por rencor. No lo olvidaría."
 tcp_request_title_creation_notification_resentful_2:0 "[recipient.GetFirstNameNoTooltip]:\n\nNo fingiré que haya afecto entre nosotros, ni gastaré tinta en halagos. Tengo las tierras del [target.GetName]. Solo pido lo que vuestra ley me niega.\n\nNegádmelo, y todo el reino sabrá por qué."
 tcp_request_title_creation_notification_ancestral:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nMis antepasados tuvieron una vez el [target.GetName], y sus gentes aún recuerdan el nombre de mi casa. Os pido licencia para alzarlo de nuevo, para que lo que mi sangre construyó vuelva a erguirse bajo vuestro gobierno.\n\nConcedédmelo, y mi casa tendrá con vos una deuda que no olvidará."
 tcp_request_title_creation_notification_ancestral_2:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nEn los salones de mi familia aún se habla de los días en que gobernábamos el [target.GetName]. No tienen por qué ser solo recuerdos: las tierras vuelven a ser mías, y solo falta vuestro consentimiento.\n\nDejad que mis antepasados descansen en paz. Dejadme restaurar lo que perdieron."
 tcp_request_title_creation_notification_heir:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nAlgún día, quiera Dios que dentro de muchos años, todo lo que gobernáis pasará a mis manos. Dejadme demostraros ahora que puedo soportar ese peso: permitidme alzar el [target.GetName] y gobernarlo como vos lo haríais.\n\nLo que construya hoy, algún día lo devolveré a la corona con creces."
 tcp_request_title_creation_notification_heir_2:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nComo vuestr[actor.Custom('ES_OA')] hereder[actor.Custom('ES_OA')], no quiero que se diga que me quedé de brazos cruzados esperando mi herencia. Os pido licencia para alzar el [target.GetName] y aprender a gobernar un gran título mientras aún estáis aquí para guiarme.\n\nSería vuestro dos veces: ahora por vuestro permiso, y después por mi sangre."
 tcp_request_title_creation_notification_family:0 "[recipient.GetFirstNameNoTooltip]:\n\nOs escribo no solo como vasall[actor.Custom('ES_OA')], sino como sangre de vuestra sangre. Las tierras que gobierno se han hecho dignas de un nombre mayor, y querría verlas alzadas como el [target.GetName].\n\nLa honra que me traiga recaerá sobre nuestra familia, y sobre vos antes que nadie. Concedédmelo y no tendréis aliado más firme en todo vuestro reino."
 tcp_request_title_creation_notification_family_2:0 "[recipient.GetFirstNameNoTooltip]:\n\nPerdonad que os escriba como pariente y no como vasall[actor.Custom('ES_OA')], pero sé que así me escucharéis mejor. Querría alzar el [target.GetName], y prefiero debéroslo a vos antes que a nadie.\n\nQue se diga que nuestra familia se alza unida."
 tcp_request_title_creation_notification_loyal:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nOs he servido con lealtad, y espero que esa lealtad hable más alto que cualquier carta. Vengo ahora a pediros un favor: permitidme alzar mis tierras como el [target.GetName].\n\nSería vuestro tan cierto como lo soy yo, y lo tendría con la misma devoción que siempre os he mostrado."
 tcp_request_title_creation_notification_loyal_2:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nCuando otros dudaron, yo permanecí a vuestro lado, y así seguiré, sea cual sea vuestra respuesta. Pero si mi servicio ha merecido algo, que sea esto: vuestra licencia para alzar el [target.GetName].\n\nSu estandarte sería uno más alzado en vuestro honor."
 tcp_request_title_creation_notification_ambitious:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nSeré franc[actor.Custom('ES_OA')]: pretendo ascender, y prefiero hacerlo con vuestra bendición que sin ella. Las tierras del [target.GetName] están bajo mi gobierno, y merecen un señor lo bastante audaz para reclamar su nombre.\n\nDadme vuestra licencia y haré de él un título digno de vuestro reino."
 tcp_request_title_creation_notification_ambitious_2:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nUn reino se engrandece cuando lo hacen sus vasallos. He reunido las tierras del [target.GetName], y no dejaré que languidezcan como condados dispersos cuando podrían ser un solo título poderoso.\n\nDejadme alzarlo. No me faltará ambición para hacerlo brillar."
 tcp_request_title_creation_notification_arrogant:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nApenas hace falta decir que nadie en vuestro reino es más digno de tener el [target.GetName] que yo. Las tierras ya son mías; el título es una mera formalidad.\n\nAun así, la ley exige que pida vuestro sello, y eso hago."
 tcp_request_title_creation_notification_arrogant_2:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nOs escribo como la ley exige, aunque confieso que me resulta extraño que alguien de mi posición tenga siquiera que pedirlo. El [target.GetName] debería ser mío, como cualquiera con ojos puede ver.\n\nConfío en que vos también lo veáis."
 tcp_request_title_creation_notification_humble:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nDudo incluso en pedirlo, pues siempre me he contentado con lo que me habéis dado. Pero mis gentes desean ver nuestras tierras alzadas como el [target.GetName], y no quería negárselo sin preguntaros antes.\n\nSi lo consideráis imprudente, no volveré a pedirlo."
 tcp_request_title_creation_notification_humble_2:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nNo soy más que un[actor.Custom('ES_XA')] humilde administrador[actor.Custom('ES_XA')] de las tierras que me confiáis, y no busco la grandeza por sí misma. Pero de estas tierras podría alzarse el [target.GetName], y serviría bien a vuestro reino.\n\nDejo el asunto por entero en vuestras manos."
 tcp_request_title_creation_notification_renowned:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nMi nombre es conocido en todo vuestro reino, y con él las hazañas que he hecho a vuestro servicio. Ya se habla de mis tierras como si fueran el [target.GetName]. Solo os pido que así sea.\n\nUn título digno de mi renombre no haría sino aumentar el vuestro."
 tcp_request_title_creation_notification_renowned_2:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nEn los salones de vuestro reino se cantan mis hazañas, y sería extraño que un vasallo de tanto renombre no tuviera un título digno. Dejadme alzar el [target.GetName], y que su gloria se cuente entre la vuestra.\n\nAguardo vuestra palabra."
 tcp_request_title_creation_notification_crown:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nLo que os pido no es poca cosa. Hace mucho que nadie ciñe la corona del [target.GetName], y las tierras que lo formarían ya me obedecen. Querría alzarlo de nuevo, aunque sé bien que en vuestro reino ninguna corona se levanta si no es por vuestra mano.\n\nDecid una palabra y se alzará en vuestro nombre, con su estandarte ondeando bajo el vuestro."
 tcp_request_title_creation_notification_crown_2:0 "Mi señor[recipient.Custom('ES_XA')]:\n\nNo pido una corona a la ligera. El [target.GetName] es un nombre grande y antiguo, y sé lo que significa alzarlo dentro de vuestro reino. Sabed que la llevaría como vuestr[actor.Custom('ES_OA')] vasall[actor.Custom('ES_OA')], nunca como vuestr[actor.Custom('ES_OA')] rival.\n\nSería una joya más en vuestra propia corona."

 tcp_grant_title_creation_interaction:0 "Conceder creación de título"
 tcp_grant_title_creation_interaction_desc:0 "Permite a [recipient.GetShortUINameNoTooltip] crear un [title|E] en tu [realm|E]. Sin tu permiso, tus [vassals|E] no pueden crear [titles|E].\n\nEl permiso dura #V 5#! años, y sigue teniendo que cumplir los requisitos habituales para crear el [title|E]."

 tcp_request_title_creation_accepted_toast:0 "Creación de título permitida"
 tcp_request_title_creation_declined_toast:0 "Creación de título denegada"
 tcp_grant_title_creation_toast:0 "Creación de título permitida"
 tcp_permission_granted_tt:0 "Puedes crear [tcp_title.GetName] en los próximos #V 5#! años"
 tcp_permission_declined_tt:0 "No puedes crear [tcp_title.GetName]"

 tcp_refused_title_creation_opinion:0 "Denegó la creación de mi título"

 tcp_answer_accepted_title:0 "La gratitud de tu vasallo"
 tcp_answer_refused_title:0 "La reacción de tu vasallo"
 tcp_answer_accepted:0 "[tcp_vassal.GetShortUIName|U] hace una reverencia. «Os lo agradezco, mi señor[tcp_liege.Custom('ES_XA')]. Lo tendré en vuestro nombre.»"
 tcp_answer_accepted_resentful:0 "[tcp_vassal.GetShortUIName|U] recibe tu permiso con un seco asentimiento. «Así que sabéis ser razonable, después de todo.»"
 tcp_answer_accepted_ambitious:0 "A [tcp_vassal.GetShortUIName|U] le brillan los ojos. «Gracias, mi señor[tcp_liege.Custom('ES_XA')]. Esto es solo el principio.»"
 tcp_answer_accepted_arrogant:0 "[tcp_vassal.GetShortUIName|U] apenas se muestra sorprendid[tcp_vassal.Custom('ES_OA')]. «Como debe ser. No esperaba menos.»"
 tcp_answer_accepted_humble:0 "[tcp_vassal.GetShortUIName|U] hace una profunda reverencia. «Me honráis mucho más de lo que merezco, mi señor[tcp_liege.Custom('ES_XA')].»"
 tcp_answer_accepted_family:0 "[tcp_vassal.GetShortUIName|U] sonríe con calidez. «Nuestra familia no olvidará esto.»"
 tcp_answer_accepted_loyal:0 "[tcp_vassal.GetShortUIName|U] se arrodilla ante ti. «Tenéis mi eterna gratitud, mi señor[tcp_liege.Custom('ES_XA')]. No os fallaré.»"
 tcp_answer_refused:0 "[tcp_vassal.GetShortUIName|U] acepta tu negativa con una rígida reverencia, pero no consigue ocultar su decepción."
 tcp_answer_refused_resentful:0 "El rostro de [tcp_vassal.GetShortUIName|U] se endurece. «Entiendo. Lo recordaré.»"
 tcp_answer_refused_ambitious:0 "[tcp_vassal.GetShortUIName|U] aprieta la mandíbula. «Entonces encontraré otra forma de ascender.»"
 tcp_answer_refused_arrogant:0 "[tcp_vassal.GetShortUIName|U] ríe con amargura. «Teméis en lo que podría convertirme. Muy bien.»"
 tcp_answer_refused_humble:0 "[tcp_vassal.GetShortUIName|U] inclina la cabeza. «Como deseéis, mi señor[tcp_liege.Custom('ES_XA')]. No debí pedirlo.»"
 tcp_answer_refused_family:0 "[tcp_vassal.GetShortUIName|U] aparta la mirada. «Esperaba que la sangre contara más que esto.»"
 tcp_answer_refused_loyal:0 "[tcp_vassal.GetShortUIName|U] suspira, pero se inclina. «No lo entiendo, mi señor[tcp_liege.Custom('ES_XA')], pero obedeceré.»"
